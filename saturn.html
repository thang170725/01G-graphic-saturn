<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Sao Thổ 3D - Clean Version</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>

<body>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.152.2/build/three.module.js';

/* =========================================================
   1. SCENE (KHÔNG GIAN)
========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.01);


/* =========================================================
   2. CAMERA
========================================================= */
const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 0, 5);


/* =========================================================
   3. RENDERER (HIỂN THỊ)
========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);


/* =========================================================
   4. LIGHTING (ÁNH SÁNG)
========================================================= */
const light = new THREE.DirectionalLight(0xffffff, 1.8);
light.position.set(5, 3, 5);
scene.add(light);

scene.add(new THREE.AmbientLight(0x222222));


/* =========================================================
   5. TẠO TEXTURE SAO THỔ (CANVAS)
========================================================= */
function createSaturnTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 2048;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  for (let y = 0; y < canvas.height; y++) {
    const t = y / canvas.height;

    const base = 180 + Math.sin(t * 30) * 25;
    const r = base + Math.sin(t * 80) * 10;
    const g = base - 20 + Math.sin(t * 50) * 10;
    const b = base - 60 + Math.sin(t * 40) * 10;

    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, canvas.width, 1);
  }

  return new THREE.CanvasTexture(canvas);
}


/* =========================================================
   6. TẠO HÀNH TINH
========================================================= */
const saturn = new THREE.Mesh(
  new THREE.SphereGeometry(1, 128, 128),
  new THREE.MeshStandardMaterial({
    map: createSaturnTexture(),
    roughness: 0.85,
    metalness: 0.05
  })
);

saturn.scale.set(2.3, 2.3, 2.3);
saturn.rotation.z = THREE.MathUtils.degToRad(60);


/* =========================================================
   7. GROUP CHÍNH (HỆ SAO THỔ)
========================================================= */
const saturnSystem = new THREE.Group();
saturnSystem.add(saturn);
scene.add(saturnSystem);


/* =========================================================
   8. PARTICLE TEXTURE (CHO VÀNH ĐAI)
========================================================= */
function createParticleTexture() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createRadialGradient(
    size/2, size/2, 2,
    size/2, size/2, size/2
  );

  gradient.addColorStop(0, 'rgba(255,255,255,0.8)');
  gradient.addColorStop(0.5, 'rgba(180,180,180,0.4)');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);

  return new THREE.CanvasTexture(canvas);
}

const particleTexture = createParticleTexture();


/* =========================================================
   9. TẠO VÀNH ĐAI (PARTICLES)
========================================================= */
const ringGroup = new THREE.Group();
saturnSystem.add(ringGroup);

const particleCount = 4000;
const innerRadius = 1.2 * 2.3;
const outerRadius = 1.9 * 2.3;

const positions = [];
const colors = [];
const speeds = [];

const palette = [
  new THREE.Color('#d9d9d9'),
  new THREE.Color('#bfbfbf'),
  new THREE.Color('#8a8a8a'),
  new THREE.Color('#f0f0f0')
];

for (let i = 0; i < particleCount; i++) {
  let r = THREE.MathUtils.lerp(innerRadius, outerRadius, Math.random());
  const angle = Math.random() * Math.PI * 2;

  const x = Math.cos(angle) * r;
  const z = Math.sin(angle) * r;
  const y = (Math.random() - 0.5) * 0.05;

  positions.push(x, y, z);

  const c = palette[Math.floor(Math.random() * palette.length)];
  colors.push(c.r, c.g, c.b);

  speeds.push(0.00005 + Math.random() * 0.00015);
}


/* =========================================================
   10. GEOMETRY + MATERIAL + PARTICLES
========================================================= */
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  map: particleTexture,
  size: 0.03,
  vertexColors: true,
  transparent: true,
  depthWrite: false
});

const particles = new THREE.Points(geometry, material);
ringGroup.add(particles);

ringGroup.rotation.z = THREE.MathUtils.degToRad(60);


/* =========================================================
   11. SIGNATURE UI
========================================================= */
const signature = document.createElement('div');
signature.innerText = "Lê Đức Thắng";

Object.assign(signature.style, {
  position: 'fixed',
  left: '20px',
  bottom: '20px',
  color: 'rgba(255,255,255,0.7)',
  fontFamily: "'Dancing Script', cursive",
  fontSize: '18px'
});

document.body.appendChild(signature);


/* =========================================================
   12. RESIZE
========================================================= */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});


/* =========================================================
   13. ANIMATION LOOP
========================================================= */
let t = 0;

function animate() {
  requestAnimationFrame(animate);

  t += 0.002;

  // camera cinematic
  camera.position.x = Math.sin(t * 0.6) * 1.2;
  camera.position.z = 5 + Math.cos(t * 0.4) * 0.8;
  camera.position.y = Math.sin(t * 0.3) * 0.4;

  camera.lookAt(0, 0, 0);

  // xoay hành tinh
  saturn.rotation.y += 0.002;

  // xoay vành đai
  const pos = geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;

    let x = pos[i3];
    let z = pos[i3 + 2];

    const a = speeds[i];
    const cos = Math.cos(a);
    const sin = Math.sin(a);

    pos[i3] = x * cos - z * sin;
    pos[i3 + 2] = x * sin + z * cos;
  }

  geometry.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
